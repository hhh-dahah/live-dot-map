<head>
<meta charset="utf-8">

<!-- v2 状态：Agent 自动读取和并发保护未启用时降级；本地草稿可恢复 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- PWA:可安装到桌面、离线可用(sw.js 只缓存应用壳,地图数据仍走本地文件夹) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#26262e">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>活点地图</title>
<style>
/* ============ 设计令牌(见 brand-spec.md) ============ */
:root{
  --bg: oklch(100% 0 0);
  --surface: oklch(98.6% 0.004 286);
  --surface-hover: oklch(96% 0.008 286);
  --fg: oklch(27% 0.015 285);
  --muted: oklch(55% 0.02 285);
  --border: oklch(91% 0.008 285);
  --accent: oklch(54% 0.16 286);
  --accent-soft: oklch(91% 0.035 288);
  --ink: oklch(24% 0.01 285);
  --success: oklch(58% 0.15 145);
  --danger: oklch(56% 0.19 27);
  --pending: oklch(68% 0.012 285);
  /* 便签黄 — 仅用于标注(人与 Agent 统一),不作他用 */
  --note: oklch(96% 0.09 90);
  --note-border: oklch(88% 0.1 85);
  --note-shadow: 0 1px 3px rgba(27,27,31,.12);
  --font-body: 'Söhne','Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-mono: 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --shadow: 0 1px 5px rgba(27,27,31,.10), 0 0 0 1px var(--border);
  --r: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);font-size:13px;color:var(--fg);background:var(--bg);
  -webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}

/* ============ 画布与世界 ============ */
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg);cursor:default}
#viewport.panning{cursor:grabbing}
/* 工具模式隐藏系统光标,改用 #crosshair 自绘准星(本机系统 crosshair 细线几乎不可见) */
#viewport.tool-place{cursor:none}
/* 拖入 map.json 时的画布高亮 */
#viewport.drop-hint{outline:3px dashed var(--accent);outline-offset:-8px}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#overview-canvas{position:absolute;pointer-events:none;visibility:hidden}
#world.lod-overview #edges,#world.lod-overview .node,#world.lod-overview .route-label,#world.lod-overview .ann{visibility:hidden}
#world.lod-overview #overview-canvas{visibility:visible}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges .hit{pointer-events:stroke;cursor:pointer}
/* 方案线手柄:悬空端点 / 弯曲控制点 */
#edges .handle{pointer-events:all;cursor:grab}
/* 箭头/新建节点等工具下统一自绘准星:避免拖线时节点/线/手柄光标频繁切换造成"光标闪烁消失"观感 */
#viewport.tool-place .node,
#viewport.tool-place #edges .hit,
#viewport.tool-place #edges .handle{cursor:none}
/* 自绘十字准星:全屏横竖细线 + 中心圈,品牌淡紫;跟随指针,悬停 UI 时隐藏 */
#crosshair{position:fixed;inset:0;pointer-events:none;z-index:35}
#crosshair i{position:absolute;display:block}
#crosshair .h{left:0;right:0;top:var(--cy,0);height:1px;background:var(--accent);opacity:.45}
#crosshair .v{top:0;bottom:0;left:var(--cx,0);width:1px;background:var(--accent);opacity:.45}
#crosshair .c{left:var(--cx,0);top:var(--cy,0);width:9px;height:9px;border:1.5px solid var(--accent);
  border-radius:50%;transform:translate(-50%,-50%);opacity:.85}

/* 节点:圆形,名称直接写在圆内(半径按文字自适应,见 nodeTextLayout) */
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:6px;cursor:grab;pointer-events:auto}
.node .dot{border-radius:50%;background:var(--bg);border:1.5px solid var(--fg);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:12.5px;font-weight:500;line-height:16px;color:var(--fg);
  transition:box-shadow .15s,border-color .15s}
.node[data-type="问题"] .dot{border-style:dashed}
/* 节点名行内编辑中:保留圆圈,仅隐藏圆内文字(透明输入框叠在圆心) */
.node.editing .dot>span:first-child{visibility:hidden}
.node[data-kind="problem"] .dot{border:2px solid var(--danger);background:oklch(96% .035 27);color:var(--danger);box-shadow:0 0 0 3px oklch(96% .08 27 / .35);position:relative}
.node[data-kind="problem"] .dot::before{content:'问题';position:absolute;top:-10px;right:-10px;padding:1px 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;font-weight:600}
.node[data-kind="problem"]:hover .dot,.node[data-kind="problem"].sel .dot{border-color:var(--danger);box-shadow:0 0 0 4px oklch(92% .12 27 / .45)}
.node.milestone .dot{border-radius:14px;border-width:2px;min-width:168px;min-height:88px;padding:12px 14px;position:relative;display:flex;flex-direction:column;gap:5px}
.node.milestone[data-origin="agent_created"] .dot{border-color:var(--accent);background:var(--accent-soft)}
.node.milestone[data-origin="human_created"] .dot{border-color:var(--fg);background:var(--surface)}
.node.milestone .milestone-meta{font-size:10px;line-height:1.2;color:var(--muted);white-space:nowrap}
.node.milestone .milestone-status{font-size:10px;line-height:1.2;color:var(--fg);font-weight:600}
.node:hover .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.node.sel .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.node.snap .dot{border-color:var(--accent);box-shadow:0 0 0 6px var(--accent-soft)}
.node.pulse .dot{animation:pulse 1.1s ease-out 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}60%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* 路线名称:低强调,双击可编辑 */
.route-label{position:absolute;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap;
  letter-spacing:.04em;transform:translate(-50%,0);cursor:text}

/* 标注:黄色小便签(人与 Agent 统一),归属由细引导线表明 */
.ann{position:absolute;font-size:12px;line-height:1.3;color:var(--fg);white-space:nowrap;
  background:var(--note);border:1px solid var(--note-border);border-radius:6px;
  padding:4px 9px;box-shadow:var(--note-shadow);pointer-events:auto;cursor:grab;
  transition:box-shadow .15s,border-color .15s}
.ann:hover{border-color:var(--accent)}
.ann.sel{border-color:var(--accent);box-shadow:var(--note-shadow),0 0 0 3px var(--accent-soft)}
.ann.editing{cursor:text;white-space:pre}
.ann.editing:empty::before{content:'输入标注';color:var(--muted)}
.ann:active{cursor:grabbing}

/* 框选后的悬浮删除按钮 */
#del-float{position:fixed;z-index:31;display:none;width:34px;height:34px;align-items:center;
  justify-content:center;border-radius:var(--r);background:var(--bg);box-shadow:var(--shadow);
  color:var(--danger)}
#del-float.on{display:flex}
#del-float:hover{background:oklch(96% 0.03 27)}
#del-float svg{width:16px;height:16px}

/* ============ 悬浮控件(Excalidraw 式) ============ */
.chrome{position:fixed;z-index:20;background:var(--bg);border-radius:var(--r);
  box-shadow:var(--shadow);display:flex;align-items:center}
.chrome .icb{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--fg);position:relative}
.chrome .icb:hover{background:var(--surface-hover)}
.chrome .icb.active{background:var(--accent-soft);color:var(--accent)}
.chrome .icb svg{width:18px;height:18px}
.chrome .sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:none}
/* 更新红点:检测到新版本时显示在项目菜单按钮右上角(平时不可见,保持简洁) */
#proj-menu-btn .upd-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);border:1.5px solid var(--bg);display:none;pointer-events:none}
#proj-menu-btn.has-update .upd-dot{display:block}

#project-pill{left:12px;top:12px;padding:0 4px 0 6px;height:44px;gap:6px}
#project-pill .pname{font-weight:600;font-size:13px;max-width:180px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#toolbar{left:50%;top:12px;transform:translateX(-50%);padding:4px;gap:2px}
#toolbar .icb kbd{position:absolute;right:3px;bottom:2px;font-size:9px;color:var(--muted);
  font-family:var(--font-mono);pointer-events:none}
#zoombar{left:12px;bottom:12px;padding:4px;gap:2px}
#zoombar .zoomv{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;
  color:var(--muted);border-radius:6px;height:28px;line-height:28px;font-size:12px}
#zoombar .zoomv:hover{background:var(--surface-hover);color:var(--fg)}

/* 框选矩形与多选包围框(Excalidraw 式) */
#marquee{position:fixed;z-index:30;border:1.5px dashed var(--accent);
  background:oklch(91% 0.035 288 / .3);display:none;pointer-events:none}
#selbox{position:absolute;border:1.5px solid var(--accent);pointer-events:none}
#selbox .h{position:absolute;width:8px;height:8px;background:var(--bg);border:1.5px solid var(--accent)}

/* ============ 属性面板(按需,右侧) ============ */
#panel{position:fixed;top:64px;right:12px;bottom:64px;width:280px;z-index:18;
  background:var(--bg);border-radius:12px;box-shadow:var(--shadow);
  display:none;flex-direction:column;overflow:hidden}
#panel.on{display:flex}
#panel header{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--border)}
#panel header .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
#panel header .t .swatch{width:10px;height:10px;border-radius:50%;flex:none}
#panel .body{overflow-y:auto;padding:6px 0;flex:1}
.field{padding:7px 14px}
.field .k{font-size:11px;color:var(--muted);margin-bottom:2px}
.field .v{font-size:13px;border-radius:6px;padding:3px 6px;margin-left:-6px;min-height:22px}
.field .v:hover{background:var(--surface-hover);cursor:text}
.field .v.pick{cursor:pointer}
.field .v[contenteditable="true"]{background:var(--accent-soft);outline:none;cursor:text}
.field .v.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.field .v.link{color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.field .v.link:hover{color:var(--fg)}
.field .v.link svg{width:13px;height:13px;flex:none}
/* 状态三段选择 */
.seg{display:flex;gap:4px;padding:3px 6px;margin-left:-6px}
.seg button{flex:1;height:28px;border-radius:6px;font-size:12px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:5px}
.seg button:hover{background:var(--surface-hover)}
.seg button.on{color:var(--fg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font-weight:500}
.seg .pip{width:8px;height:8px;border-radius:50%;flex:none}
.pip.s{background:var(--success)}.pip.f{background:var(--danger)}.pip.p{background:var(--pending)}
/* 面板内标注列表 */
.annitem{display:flex;align-items:baseline;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:6px;font-size:13px}
.annitem:hover{background:var(--surface-hover)}
.annitem .txt{flex:1;min-width:0}
.annitem .mini{opacity:0;display:flex;gap:2px;flex:none}
.annitem:hover .mini{opacity:1}
.annitem .mini button{width:22px;height:22px;border-radius:5px;color:var(--muted);
  display:flex;align-items:center;justify-content:center}
.annitem .mini button:hover{background:var(--surface);color:var(--fg)}
.annitem .mini svg{width:13px;height:13px}
.addline{padding:6px 14px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.addline:hover{color:var(--fg)}
.addline svg{width:13px;height:13px}
#panel footer{border-top:1px solid var(--border);padding:6px 8px;display:flex;justify-content:flex-end}

/* ============ 菜单 ============ */
/* Agent 写回新对象高亮（C9）：节点/方案线/便签统一用 drop-shadow 脉冲 */
@keyframes ldm-pulse{0%{filter:drop-shadow(0 0 0 color-mix(in oklch,var(--accent) 0%, transparent))}45%{filter:drop-shadow(0 0 14px var(--accent))}100%{filter:drop-shadow(0 0 0 color-mix(in oklch,var(--accent) 0%, transparent))}}
.node.pulse,[data-edge].pulse,.ann.pulse{animation:ldm-pulse 1.1s ease-out 3}
.menu{position:fixed;z-index:40;min-width:180px;background:var(--bg);border-radius:10px;
  box-shadow:var(--shadow);padding:4px;display:none;flex-direction:column}
.menu.on{display:flex;animation:menu-in .12s ease-out}
@keyframes menu-in{from{opacity:0;transform:scale(.98) translateY(-2px)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;
  font-size:13px;text-align:left;color:var(--fg)}
.menu button:hover{background:var(--surface-hover)}
.menu button.danger:hover{background:oklch(96% 0.03 27);color:var(--danger)}
.menu button svg{width:15px;height:15px;color:var(--muted);flex:none}
.menu button.danger svg{color:inherit}
.menu .msep{height:1px;background:var(--border);margin:4px 6px}
.menu .mhead{font-size:11px;color:var(--muted);padding:6px 10px 2px}
.menu .check{margin-left:auto;width:14px;height:14px;color:var(--accent)}
.menu .mkbd{margin-left:auto;padding-left:18px;font-size:11px;color:var(--muted);
  font-family:var(--font-mono)}
/* 多层展开：子菜单项右侧箭头，返回项左侧箭头；就地展开不悬浮 */
.menu button.has-sub span{flex:1}
.menu .mchev{font-style:normal;color:var(--muted);font-size:13px;line-height:1}
.menu .mchev.sub{margin-left:auto;padding-left:16px}
.menu button.mback{color:var(--muted)}
/* 顶栏项目/地图双按钮 */
#project-pill .pillbtn{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;
  font-size:13px;color:var(--fg);min-width:0}
#project-pill .pillbtn:hover{background:var(--surface-hover)}
#project-pill .pillbtn>svg{width:15px;height:15px;color:var(--muted);flex:none}
#project-pill .pilltxt{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#project-pill .pilltxt.empty{color:var(--muted);font-weight:400}
#project-pill .pilldiv{width:1px;height:18px;background:var(--border);flex:none}
/* 项目/地图弹层(带搜索,独立于命令菜单 #menu) */
#popover{position:fixed;z-index:40;width:280px;background:var(--bg);border-radius:10px;
  box-shadow:var(--shadow);padding:6px;display:none;flex-direction:column}
#popover.on{display:flex;animation:menu-in .12s ease-out}
#popover .pop-search{box-sizing:border-box;width:100%;border:1px solid var(--border);border-radius:7px;
  padding:7px 10px;font:inherit;font-size:13px;outline:none;background:var(--bg);color:var(--fg);margin-bottom:4px}
#popover .pop-search:focus{border-color:var(--accent)}
#popover .plist{max-height:320px;overflow-y:auto;display:flex;flex-direction:column}
#popover .phead{font-size:11px;color:var(--muted);padding:6px 10px 2px}
#popover .pitem{display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:7px 10px;
  border-radius:6px;font-size:13px;text-align:left;color:var(--fg)}
#popover button.pitem:hover{background:var(--surface-hover)}
#popover .pitem .pa{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#popover .pitem .pb{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#popover .pitem.cur .pa::after{content:" · 当前";color:var(--accent);font-size:11px}
#popover .psep{height:1px;background:var(--border);margin:4px 6px}
#popover .pempty{font-size:12px;color:var(--muted);padding:10px;text-align:center}
.menu button.mback .mchev{color:var(--muted);font-size:14px;margin-right:2px}
.menu button.mback:hover{color:var(--fg)}
.menu button.mback:hover .mchev{color:var(--fg)}

/* ============ 整理预览 ============ */
#curation-dialog{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(27,27,31,.16)}
#curation-dialog.on{display:flex}
#curation-card{width:min(560px,calc(100vw - 32px));max-height:min(680px,calc(100vh - 48px));overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px}
#curation-card header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
#curation-card h2{font-size:16px;margin:0;font-weight:650}
#curation-card .curation-meta{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
#curation-list{display:flex;flex-direction:column;gap:8px}
.curation-item{display:flex;gap:9px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-size:12px;line-height:1.5}
.curation-item input{margin-top:3px;accent-color:var(--accent);flex:none}
.curation-item .ctitle{font-weight:600;color:var(--fg)}
.curation-item .creason{color:var(--muted);margin-top:2px}
.curation-item .ccontext{color:var(--muted);margin-top:4px;font-family:var(--font-mono);font-size:11px}
#curation-card footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
#curation-card footer button{padding:7px 12px;border-radius:7px;font-size:12px}
#curation-apply{background:var(--accent);color:#fff}
#curation-apply:disabled{opacity:.45;cursor:not-allowed}
#curation-empty{font-size:13px;color:var(--muted);padding:20px 4px;text-align:center}

/* ============ 提示 toast ============ */
#toast{position:fixed;top:64px;left:50%;transform:translate(-50%,-8px);z-index:50;
  background:var(--ink);color:var(--bg);font-size:12px;padding:8px 14px;border-radius:8px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 行内输入(标注/名称) */
.inline-edit{background:var(--bg);border:1px solid var(--accent);border-radius:6px;
  padding:4px 8px;font:inherit;font-size:12px;outline:none;box-shadow:var(--shadow)}
/* 节点名行内输入:透明无边框,文字样式对齐圆内,叠在圆圈上原地改字 */
.inline-edit.node-edit{background:transparent;border:0;box-shadow:none;padding:0;
  text-align:center;font-size:12.5px;font-weight:500;line-height:16px;color:var(--fg)}

/* 面板底部内部编号:极小标注,可在设置中隐藏 */
.pnum{font-size:10px;color:var(--muted);text-align:center;padding:10px 0 2px}

/* 工具提示:底部居中,切换工具时短暂显示 */
#tool-hint{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:40;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 16px;
  font-size:12px;color:var(--muted);box-shadow:var(--shadow);pointer-events:none;
  opacity:0;transition:opacity .3s}
#tool-hint.on{opacity:1}

/* 首次无地图引导：只提供选择，不触发项目扫描 */
#first-map-guide{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(27,27,31,.18)}
#first-map-guide.on{display:flex}
#first-map-guide .card{width:min(520px,92vw);padding:28px;border-radius:16px;background:var(--bg);box-shadow:var(--shadow)}
#first-map-guide h2{font-size:20px;margin-bottom:8px}
#first-map-guide p{color:var(--muted);line-height:1.7;margin-bottom:16px}
#first-map-guide .choice{display:block;width:100%;padding:12px 14px;margin-top:9px;text-align:left;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
#first-map-guide .choice:hover{background:var(--surface-hover);border-color:var(--accent)}
#first-map-guide .choice strong{display:block;font-size:14px}
#first-map-guide .choice span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
#first-map-guide .choice.back-choice{text-align:center;border-style:dashed;color:var(--muted)}
#first-map-guide .choice.back-choice:hover{color:var(--fg)}

/* ============ 响应式 ============ */
@media (max-width:760px){
  #toolbar{max-width:calc(100vw - 24px);overflow-x:auto}
  #project-pill .pname{max-width:96px}
  #panel{top:auto;left:12px;right:12px;bottom:76px;width:auto;max-height:52vh}
}
</style>
</head>
<body>

<!-- 画布 -->
<div id="viewport">
  <div id="world">
    <svg id="edges" width="10" height="10"></svg>
    <!-- 节点/路线名/标注由 JS 渲染 -->
  </div>
</div>

<!-- 左上:项目 -->
<div id="crosshair" hidden><i class="h"></i><i class="v"></i><i class="c"></i></div>
<div class="chrome" id="project-pill">
  <button class="pillbtn" id="proj-btn" title="选择项目" aria-label="选择项目">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h3l1.5 2h4.5A1.5 1.5 0 0 1 14 7.5v4A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5v-6Z"/></svg>
    <span class="pilltxt empty" id="proj-folder-name">未选择项目</span>
  </button>
  <span class="pilldiv"></span>
  <button class="pillbtn" id="map-btn" title="切换地图" aria-label="切换地图">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.8 2.5 4.5 8 7.2l5.5-2.7L8 1.8Z"/><path d="m2.5 8.3 5.5 2.7 5.5-2.7M2.5 11.6 8 14.3l5.5-2.7"/></svg>
    <span class="pname" id="proj-name">动态壁纸</span>
  </button>
  <button class="icb" id="proj-menu-btn" title="更多" aria-label="更多">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h12M3 9h12M3 13h12"/></svg><span class="upd-dot"></span>
  </button>
</div>
<div id="popover"></div>

<!-- 顶部中央:核心工具 -->
<div class="chrome" id="toolbar">
  <button class="icb" data-tool="hand" title="平移画布" aria-label="平移画布">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7.5 15.5c-2 0-3.4-1.2-4.1-3.2l-.9-2.6c-.2-.5.1-1.1.6-1.3.5-.1 1 .1 1.2.6l.5 1.3V5.2a.9.9 0 0 1 1.8 0V4a.9.9 0 0 1 1.8 0v.8a.9.9 0 0 1 1.8 0v5c0 .4.5.5.7.2l.8-1.1c.3-.4.9-.5 1.3-.2.4.3.5.8.3 1.2l-1.6 2.9c-.8 1.6-2.2 2.7-4.2 2.7Z" stroke-linejoin="round"/></svg><kbd>H</kbd>
  </button>
  <button class="icb active" data-tool="select" title="选择和移动" aria-label="选择和移动">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2.5 13.5 9l-5 .8L6 14.5 4 2.5Z" stroke-linejoin="round"/></svg><kbd>V</kbd>
  </button>
  <button class="icb" data-tool="node" title="新建节点" aria-label="新建节点">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="5.5"/><path d="M9 6.5v5M6.5 9h5"/></svg><kbd>N</kbd>
  </button>
  <button class="icb" data-tool="edge" title="新建方案线" aria-label="新建方案线">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 14 13 4.5M10.5 4h3v3"/></svg><kbd>L</kbd>
  </button>
  <button class="icb" data-tool="ann" title="添加标注" aria-label="添加标注">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3.5h12v8H8l-3.5 3v-3H3v-8Z" stroke-linejoin="round"/></svg><kbd>M</kbd>
  </button>
  <div class="sep"></div>
  <button class="icb" id="more-btn" title="更多" aria-label="更多">
    <svg viewBox="0 0 18 18" fill="currentColor"><circle cx="4" cy="9" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="14" cy="9" r="1.4"/></svg>
  </button>
</div>

<!-- 左下:缩放 / 撤销 -->
<div class="chrome" id="zoombar">
  <button class="icb" id="zoom-out" title="缩小" aria-label="缩小"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h10"/></svg></button>
  <button class="zoomv" id="zoom-val" title="适应视图">100%</button>
  <button class="icb" id="zoom-in" title="放大" aria-label="放大"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h10M9 4v10"/></svg></button>
  <div class="sep"></div>
  <button class="icb" id="undo" title="撤销" aria-label="撤销"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4 3 7l3 3M3 7h7a5 5 0 0 1 0 10h-1" stroke-linejoin="round"/></svg></button>
  <button class="icb" id="redo" title="重做" aria-label="重做"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m12 4 3 3-3 3M15 7H8a5 5 0 0 0 0 10h1" stroke-linejoin="round"/></svg></button>
</div>

<!-- 属性面板 -->
<aside id="panel">
  <header>
    <span class="t" id="panel-title"></span>
    <button class="icb" id="panel-close" style="width:28px;height:28px">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
  </header>
  <div class="body" id="panel-body"></div>
  <footer><button class="icb" id="panel-more" title="更多" aria-label="更多" style="width:30px;height:30px">
    <svg viewBox="0 0 18 18" fill="currentColor"><circle cx="4" cy="9" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="14" cy="9" r="1.4"/></svg>
  </button></footer>
</aside>

<div class="menu" id="menu"></div>
<div id="curation-dialog" aria-hidden="true">
  <section id="curation-card" role="dialog" aria-modal="true" aria-labelledby="curation-title">
    <header><h2 id="curation-title">整理地图</h2><button class="icb" id="curation-close" type="button" title="关闭" aria-label="关闭">×</button></header>
    <div class="curation-meta" id="curation-meta"></div>
    <div id="curation-list"></div>
    <div id="curation-empty">正在读取整理建议…</div>
    <footer><button id="curation-recover" type="button" hidden>恢复整理前</button><span style="flex:1"></span><button id="curation-cancel" type="button">取消</button><button id="curation-apply" type="button" disabled>应用已选建议</button></footer>
  </section>
</div>
<div id="first-map-guide" aria-label="首次使用地图引导">
  <div class="card">
    <h2>从一张地图开始</h2>
    <p id="first-guide-desc">这里还没有项目地图。选择项目后所有改动自动存进项目里的 map.json，Agent 与你读写同一份文件。</p>
    <div id="first-guide-choices"></div>
  </div>
</div>
<div id="marquee"></div>
<button id="del-float" title="删除"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h12M7 5V3.5h4V5M5 5l.8 9.5h6.4L13 5" stroke-linejoin="round"/></svg></button>
<div id="toast"></div>

/* 同 from 节点的其它方案线方向角(度):悬空线取悬空端方向,已连接线取对端方向 */

      ];
      let best = cand[0], bs = 1e9;
      for (const c of cand){ const s = annScore(c.x, c.y, w, placed); if (s < bs){ bs = s; best = c; } }
      ax = best.x; ay = best.y; tx = n.x; ty = n.y;
    } else if (a.target.kind === 'canvas') {
      ax = Number.isFinite(a.x) ? a.x : 0;
      ay = Number.isFinite(a.y) ? a.y : 0;
      tx = ax; ty = ay; noLeader = true;
    } else {
      const e = edgeById(a.target.id); if (!e) continue;
      const g = edgeCurve(e), sign = signOf[e.id];
      const idx = edgeAnnIdx[e.id] = (edgeAnnIdx[e.id]||0) + 1;
      // 锚点曲线 t=0.5、方案名另一侧;压线则沿法向外移(最多两步)
      let best = null, bs = 1e9;
      for (let step = 0; step < 3; step++){
        const dist = 28 + (idx-1)*20 + step*20;
        const cx0 = g.bx - g.nx*sign*dist, cy0 = g.by - g.ny*sign*dist;
        const s = annScore(cx0 - w/2, cy0 - ANN_H/2, w, placed);
        if (s < bs){ bs = s; best = { x: cx0 - w/2, y: cy0 - ANN_H/2 }; }
        if (s === 0) break;
      }
      ax = best.x; ay = best.y; tx = g.bx; ty = g.by;
    }
    ax += a.dx||0; ay += a.dy||0; // 手动微调偏移
    // 尾巴式连接:取便签距锚点最近的一角,小角拉伸连向所属对象(替代细引导线)
    if (a.target.kind === 'node'){
      const n = nodeById(a.target.id);
      let c0 = [ax,ay], cd0 = 1e9;
      for (const c of [[ax,ay],[ax+w,ay],[ax,ay+ANN_H],[ax+w,ay+ANN_H]]){
        const dd = Math.hypot(c[0]-n.x, c[1]-n.y); if (dd < cd0){ cd0 = dd; c0 = c; }
      }
      const ddx = c0[0]-n.x, ddy = c0[1]-n.y, dl = Math.hypot(ddx,ddy)||1;
      tx = n.x + ddx/dl*(n.r+2); ty = n.y + ddy/dl*(n.r+2);
    }
    let C = [ax,ay], cd = 1e9;
    for (const c of [[ax,ay],[ax+w,ay],[ax,ay+ANN_H],[ax+w,ay+ANN_H]]){
      const dd = Math.hypot(c[0]-tx, c[1]-ty); if (dd < cd){ cd = dd; C = c; }
    }
    if (!noLeader && cd > 8){
      const ex = C[0] === ax ? 9 : -9, ey = C[1] === ay ? 9 : -9;
      leaders += `<path d="M ${C[0]+ex} ${C[1]} L ${tx} ${ty} L ${C[0]} ${C[1]+ey} Z" fill="var(--note)" stroke="var(--note-border)" stroke-width="1" stroke-linejoin="round"/>`;
    }
    annPos.push({ a, ax, ay, rot: rotOf(a.id) });
    placed.push({ x: ax, y: ay, w, h: ANN_H });
  }
  svg.innerHTML = defs + lines + leaders + labels;

  // 节点 / 路线名 / 标注
  world.querySelectorAll('.node,.route-label,.ann,#selbox').forEach(el => el.remove());
  if (S.showRoutes) for (const r of S.routes){
    if (inlineRouteEdit === r.id) continue; // 路线名行内编辑中,不重建标签避免重影
    const first = S.nodes.find(n => n.route === r.id); if (!first) continue;
    const el = document.createElement('div');
    el.className = 'route-label'; el.dataset.route = r.id;
    el.style.left = first.x + 'px'; el.style.top = (first.y - first.r - 30) + 'px';
    el.textContent = r.name;
    world.appendChild(el);
  }
  for (const n of S.nodes){
    // 节点名行内编辑中:照常渲染圆圈(editing 类隐藏圆内文字),避免"圆圈消失只剩输入框"
    const L = layout.get(n.id);
    const el = document.createElement('div');
    const milestone = n.milestone && typeof n.milestone === 'object' ? n.milestone : null;
    el.className = 'node' + (isSelObj('node', n.id) ? ' sel':'') + (S.snapTo === n.id ? ' snap':'') + (milestone ? ' milestone':'') + (inlineNodeEdit === n.id ? ' editing':'');
    el.dataset.type = n.type; el.dataset.kind = n.kind || (n.type === '问题' ? 'problem' : n.type === '结果' ? 'result' : 'goal'); el.dataset.id = n.id;
    el.setAttribute('role', 'button'); el.setAttribute('aria-label', `${el.dataset.kind === 'problem' ? '问题节点' : '节点'}：${n.name}`);
    if (milestone) { el.dataset.origin = milestoneOrigin(milestone); el.dataset.level = milestone.level || 'project'; }
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    const milestoneMeta = milestone
      ? `<span class="milestone-meta">${esc(milestoneSourceLabel(milestone))} · ${esc(milestoneLevelLabel(milestone))}</span><span class="milestone-status">${esc(MILESTONE_STATUS[milestone.status] || '待审核')}</span>`
      : '';
    el.innerHTML = `<div class="dot" style="width:${milestone ? Math.max(168,n.r*2) : n.r*2}px;height:${milestone ? Math.max(88,n.r*1.25) : n.r*2}px"><span>${L.lines.map(esc).join('<br>')}</span>${milestoneMeta}</div>`;
    world.appendChild(el);
  }
  for (const { a, ax, ay, rot } of annPos){
    if (inlineEditing && inlineEditing.annId === a.id) continue; // 编辑中的便签由输入框占位,不重建(避免重影)
    const el = document.createElement('div');
    el.className = 'ann' + (S.selAnn === a.id ? ' sel':''); el.dataset.ann = a.id;
    el.style.left = ax + 'px'; el.style.top = ay + 'px';
    el.style.transform = `rotate(${rot}deg)`;
    el.textContent = a.text;
    world.appendChild(el);
  }
  // 多选包围框:紫蓝实线 + 四角手柄(Excalidraw 式)
  if (S.multi.length){
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    const grow = (x,y) => { minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y); };
    for (const m of S.multi){
      if (m.kind==='node'){ const n=nodeById(m.id); if (n){ grow(n.x-n.r,n.y-n.r); grow(n.x+n.r,n.y+n.r); } }
      else { const e=edgeById(m.id); if (e){ const g=edgeCurve(e); grow(g.x1,g.y1); grow(g.x2,g.y2); grow(g.cpx,g.cpy); } }
    }
    const pad=14, box=document.createElement('div');
    box.id='selbox';
    box.style.left=(minX-pad)+'px'; box.style.top=(minY-pad)+'px';
    box.style.width=(maxX-minX+pad*2)+'px'; box.style.height=(maxY-minY+pad*2)+'px';
    for (const [hx,hy] of [[0,0],[100,0],[0,100],[100,100]]){
      const h=document.createElement('div'); h.className='h';
      h.style.left=`calc(${hx}% - 5px)`; h.style.top=`calc(${hy}% - 5px)`;
      box.appendChild(h);
    }
    world.appendChild(box);
  }
  updateOverviewCanvas();
  applyView();
  rememberRender(renderStructureKey());
}

/* ---------- 状态:只改颜色,与连接关系解耦 ---------- */
function setEdgeStatus(e, s){
  if (e.status === s) return;
  pushHistory();
  e.status = s; // 连不连节点由用户自己定(拖拽/「新建连接节点」),不随状态强制
  render(); renderPanel();
}
/* 为悬空方案线自动创建目标节点并连接(右键菜单「新建连接节点」) */
function createTargetNode(e){
  pushHistory();
  const from = nodeById(e.from);
  const end = { x: from.x + (e.dx||220), y: from.y + (e.dy||0) };
  const name = `新节点${S.nextNodeName++}`;
  const nodeId = 'n' + S.nextNum, nodeNum = String(S.nextNum++).padStart(2,'0');
  const n = { id:nodeId, num:nodeNum,
    name, type:'结果', kind:'result', route:e.route, x:end.x, y:end.y, r:34,
    md: mdPath('nodes', nodeId), createdBy:'human' };
  delete e.dx; delete e.dy;
  S.nodes.push(n); e.to = n.id;
  render(); renderPanel();
}

function setNodeKind(n, kind){
  if (!n || !['goal','problem','result'].includes(kind)) return;
  const nextType = { goal:'目标', problem:'问题', result:'结果' }[kind];
  const current = n.kind || (n.type === '问题' ? 'problem' : n.type === '结果' ? 'result' : 'goal');
  if (current === kind && n.type === nextType) return;
  if (IO.readOnly){ warnReadOnly(); return; }
  pushHistory();
  n.kind = kind; n.type = nextType; n.resolved = kind === 'problem' ? false : n.resolved;
  n.updatedAt = today();
  render(); renderPanel();
  toast(kind === 'problem' ? '已设为问题节点' : kind === 'result' ? '已设为结果节点' : '已设为目标节点');
}

/* ---------- 菜单 ---------- */
const menu = $('#menu');
function openMenu(items, x, y, parent){
  menu.innerHTML = items.map(it => it.sep ? '<div class="msep"></div>' :
    it.head ? `<div class="mhead">${esc(it.head)}</div>` :
    it.back ? `<button data-mi="__back" class="mback"><span class="mchev">‹</span><span>${esc(it.label)}</span></button>` :
    `<button data-mi="${esc(it.id)}" class="${it.danger?'danger':''}${it.sub?'has-sub':''}">${it.icon||''}<span>${esc(it.label)}</span>${it.sub?'<i class="mchev sub">›</i>':''}${it.checked?I.check:''}${it.kbd?`<kbd class="mkbd">${esc(it.kbd)}</kbd>`:''}</button>`
  ).join('');
  menu.classList.add('on');
  const mw = 218, mh = items.length * 36 + 16;
  menu.style.left = Math.min(x, innerWidth - mw - 8) + 'px';
  menu.style.top = Math.min(y, innerHeight - mh - 8) + 'px';
  menu._items = items;
  menu._parent = parent;
  menu._pos = { x, y };
}
function closeMenu(){ menu.classList.remove('on'); }
menu.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-mi]'); if (!b) return;
  if (b.dataset.mi === '__back'){
    const back = menu._parent;
    if (back) openMenu(back.items, back.x, back.y);
    return;
  }
  const it = menu._items.find(i => i.id === b.dataset.mi);
  if (!it) return;
  if (it.sub){
    // 子菜单就地展开（父级压栈），自动带返回项回到上一级；一次点击可达、不悬浮。
    openMenu([{ back:true, label: it.label }, ...it.sub], menu._pos.x, menu._pos.y, { items: menu._items, x: menu._pos.x, y: menu._pos.y });
    return;
  }
  closeMenu(); it.fn && it.fn();
});

function closeCurationDialog(){
  const dialog = $('#curation-dialog');
  if (!dialog) return;
  dialog.classList.remove('on');
  dialog.setAttribute('aria-hidden','true');
}
function setCurationBusy(busy){
  const apply = $('#curation-apply');
  if (apply) apply.disabled = busy || !document.querySelector('#curation-list input:checked:not(:disabled)');
  const cancel = $('#curation-cancel');
  if (cancel) cancel.disabled = busy;
}
function curationObject(id){
  return [...S.routes,...S.nodes,...S.edges].find(item => String(item.id) === String(id));
}
function updateCurationMeta(){
  const dialog=$('#curation-dialog'), plan=dialog?._curationPlan, meta=$('#curation-meta');
  if (!plan || !meta) return;
  const selected=new Set([...document.querySelectorAll('#curation-list input:checked')].map(input=>input.dataset.suggestionId));
  const chosen=(plan.suggestions||[]).filter(s=>selected.has(String(s.id)));
  const archivedEdges=new Set(), archivedRoutes=new Set();
  for (const suggestion of chosen) for (const command of (suggestion.commands||[])){
    if (command.op==='update' && command.patch?.archived===true){
      if (command.collection==='edges') archivedEdges.add(String(command.id));
      if (command.collection==='routes') archivedRoutes.add(String(command.id));
    }
  }
  const counts=plan.counts||{}, current=plan.projection?.current||{};
  const position=current.nodeName ? ` · 当前位置 ${current.nodeName}（${current.source==='stored'?'已保存':current.source==='inferred'?'推测':'未知'}）` : '';
  meta.dataset.currentSource=String(current.source||'none');
  meta.textContent=`revision ${plan.revision??'—'} · 路线 ${counts.routes??0}→${Math.max(0,(counts.routes??0)-archivedRoutes.size)} · 节点 ${counts.activeNodes??0}→${counts.activeNodes??0} · 方案 ${counts.activeEdges??0}→${Math.max(0,(counts.activeEdges??0)-archivedEdges.size)}${position}`;
}
async function openCurationDialog(){
  const dialog = $('#curation-dialog');
  const list = $('#curation-list');
  const empty = $('#curation-empty');
  const meta = $('#curation-meta');
  if (!dialog || !list || !empty || !meta) return;
  if (!window.LiveDotBridge?.active || typeof window.LiveDotBridge.planConsolidation !== 'function'){
    toast('请先打开一张已保存的地图');
    return;
  }
  dialog.classList.add('on'); dialog.setAttribute('aria-hidden','false');
  list.textContent = ''; empty.textContent = '正在读取整理建议…'; empty.style.display = 'block';
  meta.textContent = '';
  const recover=$('#curation-recover'); if (recover) recover.hidden=!window.LiveDotBridge.latestCheckpoint;
  $('#curation-apply').disabled = true;
  try{
    const plan = await window.LiveDotBridge.planConsolidation({ maxSuggestions: 12 });
    const suggestions = Array.isArray(plan.suggestions) ? plan.suggestions : [];
    dialog._curationPlan = plan; updateCurationMeta();
    if (!suggestions.length){ empty.textContent = '没有需要整理的内容'; return; }
    empty.style.display = 'none';
    for (const suggestion of suggestions){
      const label = document.createElement('label'); label.className = 'curation-item';
      const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.dataset.suggestionId = String(suggestion.id || '');
      const applyable = suggestion.applyable !== false && Array.isArray(suggestion.commands) && suggestion.commands.length > 0;
      checkbox.disabled = !applyable;
      checkbox.addEventListener('change', () => { setCurationBusy(false); updateCurationMeta(); });
      const body = document.createElement('span');
      const title = document.createElement('span'); title.className = 'ctitle'; title.textContent = `${String(suggestion.title || suggestion.id || '整理建议')}${applyable?'':'（仅预览）'}`;
      const reason = document.createElement('span'); reason.className = 'creason'; reason.textContent = String(suggestion.reason || '');
      const objectIds=Array.isArray(suggestion.objectIds)?suggestion.objectIds.map(String):[];
      const sources=[...new Set(objectIds.map(id=>curationObject(id)).filter(Boolean).map(item=>actorLabel(item.createdBy||item.updatedBy)))];
      const context=document.createElement('div'); context.className='ccontext'; context.textContent=`对象 ${objectIds.join('、')||'—'} · 来源 ${sources.join('、')||'未知'}`;
      body.append(title, document.createElement('br'), reason, context); label.append(checkbox, body); list.append(label);
    }
    dialog._curationPlan = plan;
  }catch(error){
    window.LiveDotBridge?.logError?.('curation.preview.failed', error);
    empty.textContent = '整理预览读取失败，请稍后重试。';
  }
}
$('#curation-close')?.addEventListener('click', closeCurationDialog);
$('#curation-cancel')?.addEventListener('click', closeCurationDialog);
$('#curation-dialog')?.addEventListener('click', ev => { if (ev.target === $('#curation-dialog')) closeCurationDialog(); });
$('#curation-apply')?.addEventListener('click', async () => {
  const dialog = $('#curation-dialog'); const plan = dialog?._curationPlan;
  const selected = [...document.querySelectorAll('#curation-list input:checked')].map(input => input.dataset.suggestionId);
  if (!plan || !selected.length || !window.LiveDotBridge?.active) return;
  const commands = (plan.suggestions || []).filter(s => selected.includes(String(s.id))).flatMap(s => Array.isArray(s.commands) ? s.commands : []);
  if (!commands.length) return;

/* 复制对象引用给 Agent:格式对齐 agent-kit SKILL.md「画布引用寻址」 */
function objectRefText(kind, item){
  if (kind === 'node'){
    const routeName = item.route ? (S.routes.find(r => r.id === item.route)?.name || item.route) : '无';
    const md = item.md || mdPath('nodes', item.id);
    return `[活点地图] 节点「${item.name || item.num}」${item.id}（${item.type || '目标'}，路线 ${routeName}）→ ${md}`;
  }
  if (kind === 'edge'){
    const statusLabel = item.status === 'success' ? '成功' : item.status === 'failed' ? '失败' : '待验证';
    const routeName = item.route ? (S.routes.find(r => r.id === item.route)?.name || item.route) : '无';
    const md = item.md || mdPath('routes', item.id);
    return `[活点地图] 方案「${item.name || item.id}」${item.id}（${statusLabel}，路线 ${routeName}）→ ${md}`;
  }
  return `[活点地图] 标注「${item.text || ''}」${item.id} → map.json#anns/${item.id}`;
}
function copyObjectRef(kind, item){
  const text = objectRefText(kind, item);
  const done = () => toast('引用已复制，可直接粘贴给 Agent');
  if (navigator.clipboard?.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); done();
  } catch { toast('复制失败，请手动复制引用文本'); }
}
/* 普通节点就地升级为问题路线起点:直连方案线与对端节点并入新路线 */
function promoteToIssueRoute(n){
  if (S.routes.some(r => r.source === n.id)){ toast('这个节点已经是路线起点。'); return; }
  pushHistory();
  const rid = 'r' + Date.now();
  S.routes.push({ id:rid, name:`分支路线${S.nextRouteName++}`, source:n.id });
  n.type = '问题'; n.kind = 'problem'; n.route = rid;
  for (const e of S.edges){
    if (e.from === n.id || e.to === n.id){
      e.route = rid;
      const other = nodeById(e.from === n.id ? e.to : e.from);
      if (other) other.route = rid;
    }
  }
  render(); renderPanel();
  toast('已升级为问题路线');
}
function addNodeAt(x, y){

let inlineEditing = null; // 正在行内编辑的便签 {annId, input}
let inlineEdgeEdit = null; // 正在行内编辑方案名的边 id
let inlineNodeEdit = null; // 正在行内编辑名称的节点 id
let inlineRouteEdit = null; // 正在行内编辑名称的路线 id
/* 在目标元素位置弹固定定位行内输入框:Enter 提交、Escape 取消、blur 提交 */
function popInlineEdit(rect, initial, onCommit, cls){
  const input = document.createElement('input');
  input.className = 'inline-edit' + (cls ? ' ' + cls : ''); input.value = initial;
  input.style.position = 'fixed';
  input.style.left = (rect.left + rect.width/2) + 'px'; input.style.top = (rect.top + rect.height/2) + 'px';
  input.style.transform = 'translate(-50%,-50%)';
  input.style.width = Math.max(120, rect.width + 40) + 'px'; input.style.zIndex = 60;
  document.body.appendChild(input); input.focus(); input.select();
  let finished = false;
  const commit = () => {
    if (finished) return; finished = true;
    const v = input.value.trim();
    if (input.isConnected) input.remove(); // render() 不清理输入框,必须自己移除
    onCommit(v);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    if (ev.isComposing || ev.keyCode === 229) return; // 中文输入法组词中不拦截按键
    if (ev.key === 'Enter') commit();
    if (ev.key === 'Escape'){ input.value = initial; commit(); }
  });
}
/* 节点名双击行内编辑:保存后同步 Markdown 文件名,半径随文字自动重算 */
function editNodeName(n, nodeEl){
  inlineNodeEdit = n.id;
  const rect = nodeEl.getBoundingClientRect();
  render(); // 应用 editing 类:圆圈保留、圆内文字隐藏,输入框叠在圆心
  popInlineEdit(rect, n.name, v => {
    inlineNodeEdit = null;
    if (v && v !== n.name){ pushHistory(); n.name = v; n.md ||= mdPath('nodes', n.id); }
    render(); renderPanel();
  }, 'node-edit');
}
/* 路线名双击行内编辑 */
function editRouteName(r, labelEl){
  inlineRouteEdit = r.id;
  popInlineEdit(labelEl.getBoundingClientRect(), r.name, v => {
    inlineRouteEdit = null;
    if (v && v !== r.name){ pushHistory(); r.name = v; }

/* 方案名双击行内编辑:在标签位置弹输入框,Enter 保存 */
function editEdgeName(e, textEl){
  const r = textEl.getBoundingClientRect();
  const input = document.createElement('input');
  input.className = 'inline-edit'; input.value = e.name;
  input.style.position = 'fixed';
  input.style.left = (r.left + r.width/2) + 'px'; input.style.top = (r.top + r.height/2) + 'px';
  input.style.transform = 'translate(-50%,-50%)';
  input.style.width = Math.max(120, r.width + 40) + 'px'; input.style.zIndex = 60;
  document.body.appendChild(input); input.focus(); input.select();
  inlineEdgeEdit = e.id;
  let finished = false;
  const commit = () => {
    if (finished) return; finished = true;
    inlineEdgeEdit = null;
    const v = input.value.trim();
    if (input.isConnected) input.remove(); // render() 不清理输入框,必须自己移除
    if (v && v !== e.name){ pushHistory(); e.name = v; e.md ||= mdPath('routes', e.id); }
    render(); renderPanel();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    if (ev.isComposing || ev.keyCode === 229) return; // 中文输入法组词中不拦截按键
    if (ev.key === 'Enter') commit();
    if (ev.key === 'Escape'){ input.value = e.name; commit(); }
  });
}
function inlineEdit(el, initial, done){
  const input = document.createElement('input');
  input.className = 'inline-edit'; input.value = initial;
  input.style.width = Math.max(120, el.offsetWidth + 24) + 'px';
  el.replaceWith(input); input.focus(); input.select();
  let finished = false;
  const commit = () => {
    if (finished) return; finished = true;
    const v = input.value.trim();
    if (input.isConnected) input.replaceWith(el);
    done(v);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    if (ev.isComposing || ev.keyCode === 229) return; // 中文输入法组词中不拦截按键
    if (ev.key === 'Enter') commit();
    if (ev.key === 'Escape'){ input.value = initial; commit(); }
  });
}
/* 便签行内编辑:点击已选中的便签直接在原位置改字 */
function editAnn(a){
  const el = document.querySelector(`.ann[data-ann="${a.id}"]`); if (!el) return;
  const input = document.createElement('input');
  input.className = 'inline-edit'; input.value = a.text;
  input.style.position = 'absolute'; input.style.left = el.style.left; input.style.top = el.style.top;
  input.style.width = Math.max(120, el.offsetWidth + 24) + 'px'; input.style.zIndex = 5;
  el.replaceWith(input); input.focus(); input.select();
  inlineEditing = { annId: a.id, input };
  let finished = false;
  const commit = () => {
    if (finished) return; finished = true;
    inlineEditing = null;
    const v = input.value.trim();
    if (input.isConnected) input.remove(); // render() 不清理输入框,必须自己移除
    if (v && v !== a.text){ pushHistory(); a.text = v; }
    render(); renderPanel();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    if (ev.isComposing || ev.keyCode === 229) return; // 中文输入法组词中不拦截按键
    if (ev.key === 'Enter') commit();
    if (ev.key === 'Escape'){ input.value = a.text; commit(); }
  });
}

let updateInfo = null;           // { current, latest, available } | null
let updateChecked = false;
async function checkForUpdate(){
  if (!window.LiveDotBridge?.active) return;
  const info = await window.LiveDotBridge.checkUpdate();
  if (!info || typeof info !== 'object') return;
  updateInfo = info;
  $('#proj-menu-btn').classList.toggle('has-update', !!info.available);
}
async function applyUpdateFlow(){
  if (!updateInfo || !updateInfo.available) return;
  const ok = confirm(`发现新版本 ${updateInfo.latest}（当前 ${updateInfo.current}）。\n\n更新需要重启画布，已保存的内容不会丢失。是否现在更新？`);
  if (!ok) return;
  try {
    toast(`正在下载更新 ${updateInfo.latest}…`);
    await window.LiveDotBridge.applyUpdate();
    updateInfo = null;
    $('#proj-menu-btn').classList.remove('has-update');
    toast('更新完成，画布即将重新打开…');
  } catch (error) {
    window.LiveDotBridge?.logError?.('update.failed', error);
    toast('更新失败，请稍后重试。');
  }
}

if (false){
setInterval(() => {
  if (window.LiveDotBridge?.active){

  popInlineEdit(label.getBoundingClientRect(), S.name || label.textContent || '未命名地图', value => {
    if (!value || value === S.name) return;

const popover = $('#popover');
let popoverKind = '';
function closePopover(){ popover.classList.remove('on'); popoverKind = ''; }
function placePopover(anchor, heightGuess){
  const r = anchor.getBoundingClientRect();
  popover.style.left = Math.max(8, Math.min(r.left, innerWidth - 296)) + 'px';
  popover.style.top = Math.min(r.bottom + 6, innerHeight - heightGuess - 8) + 'px';
}
/* 当前项目根路径(桥模式)或文件夹句柄名(直连模式) */
function currentProjectRoot(){
  if (window.LiveDotBridge?.active){
    return new URLSearchParams(location.search).get('project') || sessionStorage.getItem('live-dot-map-project') || '';
  }
  return IO.dir?.name || '';
}
function currentProjectName(){
  const root = currentProjectRoot();
  return root ? (root.split(/[\\/]/).filter(Boolean).pop() || root) : '';
}
function syncProjectPill(){
  const el = $('#proj-folder-name'); if (!el) return;
  const name = currentProjectName();

function popoverItem(label, sub, fn){

  if (sub){ const p = document.createElement('span'); p.className = 'pb'; p.textContent = sub; b.appendChild(p); }

async function openProjectPopover(){

  popoverKind = 'project';
  popover.innerHTML = '<input class="pop-search" id="pop-search" placeholder="搜索项目" autocomplete="off"><div class="plist" id="pop-list"></div>';
  popover.classList.add('on');
  placePopover($('#proj-btn'), 340);
  $('#pop-search').focus();
  const bridge = window.LiveDotBridge;
  let recent = [];
  if (bridge?.active && typeof bridge.recentProjects === 'function'){
    try { recent = await bridge.recentProjects(); } catch { recent = []; }
  }
  const currentRoot = currentProjectRoot();
  const listEl = $('#pop-list');
  const renderList = (filter) => {
    const q = filter.trim().toLowerCase();
    const items = q ? recent.filter(r => r.toLowerCase().includes(q)) : recent;
    listEl.textContent = '';
    if (items.length){
      const head = document.createElement('div'); head.className = 'phead'; head.textContent = '最近项目';
      listEl.appendChild(head);

        const b = popoverItem(root.split(/[\\/]/).filter(Boolean).pop() || root, root, null);

        listEl.appendChild(b);

      listEl.appendChild(em);

    const sep = document.createElement('div'); sep.className = 'psep'; listEl.appendChild(sep);
    listEl.appendChild(popoverItem(
      bridge?.active ? '选择其他项目…' : '选择项目文件夹…', '',
      () => {
        if (bridge?.active) void pickProjectFlow();

        else toast('连接项目需要 Chrome 或 Edge；也可以导出 map.json 交给 Agent。');

/* 地图弹层：当前项目的地图列表（名称+更新时间+当前标记）+ 新建/重命名/导入/导出 */
async function openMapPopover(){
  if (popover.classList.contains('on') && popoverKind === 'map'){ closePopover(); return; }
  popoverKind = 'map';
  popover.innerHTML = '';
  const list = document.createElement('div'); list.className = 'plist';
  const head = document.createElement('div'); head.className = 'phead'; head.textContent = '当前项目的地图';
  list.appendChild(head);
  popover.appendChild(list);
  popover.classList.add('on');
  placePopover($('#map-btn'), 320);
  const bridge = window.LiveDotBridge;
  let maps = [], activeMap = '';
  try{
    if (bridge?.active && typeof bridge.listMaps === 'function'){
      ({ maps, activeMap } = await bridge.listMaps());
    } else if (IO.dir){
      ({ maps, activeMap } = await fsListMaps(IO.dir));
    }
  }catch{ maps = []; }
  if (popoverKind !== 'map') return; // 等待期间弹层已被关闭/替换
  if (maps.length){
    for (const m of maps){
      const b = popoverItem(m.name || m.id, m.updatedAt ? `更新于 ${String(m.updatedAt).slice(0, 10)}` : '', null);
      if (m.id === activeMap) b.classList.add('cur');
      b.onclick = () => { closePopover(); if (m.id !== activeMap) void switchMapById(m.id); };
      list.appendChild(b);
    }
  } else {
    const cur = popoverItem(S.name || '未命名地图', '', null);
    cur.classList.add('cur'); cur.style.cursor = 'default';
    list.appendChild(cur);
  }
  const sep = document.createElement('div'); sep.className = 'psep'; list.appendChild(sep);

  list.appendChild(popoverItem('重命名地图…', '', () => renameMap()));
  list.appendChild(popoverItem('导入 map.json…', '', () => importMap()));

async function pickProjectFlow(){
  if (!window.LiveDotBridge?.active) return;
  try {
    const result = await window.LiveDotBridge.pickProject();
    toast(result ? '已切换到所选项目' : '已取消');
    if (result) syncProjectPill();
  } catch (error) {
    toast('切换失败：' + projectSwitchErrorText(error));
  }
}
async function switchProjectFlow(root){
  try {
    await window.LiveDotBridge.switchProject(root);
    toast('已切换到 ' + (root.split(/[\\/]/).filter(Boolean).pop() || root));
    syncProjectPill();
  } catch (error) {
    toast('切换失败：' + projectSwitchErrorText(error));
  }
}
/* 项目切换报错展开桥的 details（原因 + 隔离路径），便于排错 */
function projectSwitchErrorText(error){
  const base = error?.message || '未知错误';
  const details = error?.details;
  const extra = [];
  if (details?.causeMessage) extra.push('原因：' + details.causeMessage);
  if (details?.quarantinePath) extra.push('损坏文件已隔离：' + details.quarantinePath);
  return extra.length ? `${base}（${extra.join('；')}）` : base;
}

/* ---------- 画布交互:平移 / 缩放 / 拖拽 / 框选 / 拉出方案线 ---------- */
let drag = null, spaceDown = false;
const marqueeEl = $('#marquee'), delFloat = $('#del-float'), crosshairEl = $('#crosshair');
/* 指针移出窗口时隐藏自绘准星 */
addEventListener('pointerout', ev => { if (!ev.relatedTarget) crosshairEl.hidden = true; });
delFloat.innerHTML = I.trash;
/* 二次贝塞尔取点:弯折命中检测用 */
function bezPt(t, g){ const it = 1-t;
  return { x: it*it*g.x1 + 2*it*t*g.cpx + t*t*g.x2, y: it*it*g.y1 + 2*it*t*g.cpy + t*t*g.y2 }; }
function clearMulti(){ S.multi = []; delFloat.classList.remove('on'); }
viewport.addEventListener('pointerdown', ev => {
  closeMenu();
  if (ev.button !== 0 && ev.button !== 1) return;
  if (ev.target.closest('.chrome,#panel,#popover,.menu')) return;
  if (ev.target.closest('.inline-edit')) return; // 点击行内输入框不触发画布交互
  // 手掌工具:拖任何位置都是平移(Excalidraw 式),对象不可拖
  if (S.tool === 'hand'){
    drag = { type:'pan', sx:ev.clientX, sy:ev.clientY, ox:S.view.x, oy:S.view.y };
    viewport.classList.add('panning');
    return;
  }
  // 空格/中键:任何工具模式下都优先平移
  if (spaceDown || ev.button === 1){
    drag = { type:'pan', sx:ev.clientX, sy:ev.clientY, ox:S.view.x, oy:S.view.y };
    viewport.classList.add('panning');
    return;
  }
  const nodeEl = ev.target.closest('.node');
  const edgeEl = ev.target.closest('[data-edge]');
  const annEl = ev.target.closest('.ann');
  const w = toWorld(ev.clientX, ev.clientY);

  if (S.tool === 'node' && !nodeEl){ pushHistory(); addNodeAt(w.x, w.y); setTool('select'); return; }
  // 方案线工具:在节点上按住直接拉出,起点自动吸附该节点;终点松手时命中节点则吸附并变绿
  if (S.tool === 'edge'){
    if (nodeEl){
      pushHistory();
      const fromId = nodeEl.dataset.id, from = nodeById(fromId);
      // 方案名从起点节点自己的 1 开始数,区分靠内部编号
      const eName = `方案${S.edges.filter(o => o.from === fromId).length + 1}`;
      const e = { id:'e'+(S.nextEdge++), from:fromId, to:null, name:eName,
        status:'pending', route:from.route, md: mdPath('routes', `e${S.nextEdge-1}`) };
      S.edges.push(e);
      e.dx = w.x - from.x; e.dy = w.y - from.y; // 方向跟随指针:拖拽时自由自定义
      S.drawingEdge = e.id; S.sel = {kind:'edge', id:e.id}; S.selAnn = null; clearMulti();
      // 新建边拉出中保持直线,不用前段锚点算法(锚点仅用于已存在边重布线)
      drag = { type:'end', e, moved:false, sx:ev.clientX, sy:ev.clientY };
      render(); renderPanel();
    }
    return;
  }
  if (S.tool === 'ann'){
    if (nodeEl) addAnnotation('node', nodeEl.dataset.id);
    else if (edgeEl) addAnnotation('edge', edgeEl.dataset.edge);
    else addAnnotation('canvas', null, w);
    setTool('select'); return;
  }

  // 方案线手柄优先:悬空端点 / 弯曲控制点(手柄本身也带 data-edge,必须先判断)
  const handleEl = ev.target.closest('[data-handle]');
  if (handleEl){
    const e = edgeById(handleEl.dataset.edge);
    if (e){
      const t = handleEl.dataset.handle === 'bend' ? .5 : 0; // 弯曲手柄在曲线中点
      // 拖动已连接端点即重新布线:先脱钩悬空变灰,拖到别的节点松手则吸附变绿
      if (handleEl.dataset.handle === 'end' && e.to){
        const a = nodeById(e.from), b = nodeById(e.to);
        e.dx = b.x - a.x; e.dy = b.y - a.y; e.to = null;
        e.status = 'pending';
        drag = { type:'end', e, t, moved:false, sx:ev.clientX, sy:ev.clientY, wasConnected:true, anchor: bezPt(.25, edgeCurve(e)) };
      } else {
        drag = { type:handleEl.dataset.handle, e, t, moved:false, sx:ev.clientX, sy:ev.clientY };
        if (handleEl.dataset.handle === 'end') drag.anchor = bezPt(.25, edgeCurve(e));
      }
    }
    return;
  }
  // 便签:选中态紫色;已选中再点直接行内编辑;拖动微调位置
  if (annEl){
    const a = S.anns.find(x => x.id === annEl.dataset.ann);
    if (a){
      drag = { type:'ann', a, moved:false, sx:ev.clientX, sy:ev.clientY, odx:a.dx||0, ody:a.dy||0,
        wasSel: S.selAnn === a.id };
      return;
    }
  }
  if (nodeEl){
    const n = nodeById(nodeEl.dataset.id);
    drag = { type:'node', n, moved:false, sx:ev.clientX, sy:ev.clientY, ox:n.x, oy:n.y };
  } else if (edgeEl){
    // 选中后可直接按住线身弯折:抓取点固定在指针下,其余部分随之变形(Excalidraw 式)
    const eid = edgeEl.dataset.edge, e = edgeById(eid);
    if (!(S.sel && S.sel.kind === 'edge' && S.sel.id === eid)) select('edge', eid);
    if (e){
      let t = .5, bd = 1e9; const g = edgeCurve(e);
      for (let tt = .05; tt < .951; tt += .05){
        const p = bezPt(tt, g), dd = Math.hypot(p.x-w.x, p.y-w.y);
        if (dd < bd){ bd = dd; t = tt; }
      }
      drag = { type:'bend', e, t, moved:false, sx:ev.clientX, sy:ev.clientY };
    }
  } else if (ev.button === 1 || spaceDown){
    drag = { type:'pan', sx:ev.clientX, sy:ev.clientY, ox:S.view.x, oy:S.view.y };
    viewport.classList.add('panning');
  } else {
    // 空白处拖拽 = 紫色框选(Excalidraw 式);平移用滚轮/中键/空格
    S.sel = null; S.selAnn = null; clearMulti(); renderPanel(); render();
    drag = { type:'marquee', sx:ev.clientX, sy:ev.clientY };
    marqueeEl.style.display = 'block';
  }
});
function addEdge(fromId, toId, w){
  const from = nodeById(fromId);
  const eName = `方案${S.edges.filter(o => o.from === fromId).length + 1}`;
  const e = { id:'e'+(S.nextEdge++), from:fromId, to:toId, name:eName,
    status: toId ? 'success' : 'pending', route:from.route,
    md: mdPath('routes', `e${S.nextEdge-1}`) };
  if (!toId){ e.dx = w.x - from.x; e.dy = w.y - from.y; }
  S.edges.push(e); select('edge', e.id); render();
}
let renderFrame = 0;
function scheduleRender(){
  if (renderFrame) return;
  renderFrame = requestAnimationFrame(() => { renderFrame = 0; render(); });
}
addEventListener('pointermove', ev => {
  // 自绘十字准星跟随:工具模式下显示,悬停 UI(工具栏/面板/菜单/输入框)时隐藏
  crosshairEl.style.setProperty('--cx', ev.clientX + 'px');
  crosshairEl.style.setProperty('--cy', ev.clientY + 'px');
  crosshairEl.hidden = !viewport.classList.contains('tool-place')
    || !!(ev.target.closest && ev.target.closest('.chrome,#panel,#popover,.menu,.inline-edit'));
  // 无拖拽时:方案线悬停紫色发光
  if (!drag){
    if (S.tool !== 'select') { if (S.hoverEdge){ S.hoverEdge = null; render(); } return; }
    const w = toWorld(ev.clientX, ev.clientY);
    let hov = null;
    for (const e of S.edges){
      if (isEdgeArchived(e)) continue; // 归档线不参与悬停命中
      const g = edgeCurve(e);
      for (let t = 0; t <= 1.001; t += .04){
        const p = bezPt(t, g);
        if (Math.hypot(p.x-w.x, p.y-w.y) < 8/S.view.k){ hov = e.id; break; }
      }
      if (hov) break;
    }
    if (hov !== S.hoverEdge){ S.hoverEdge = hov; scheduleRender(); }
    return;
  }
  if (drag.type === 'pan'){
    S.view.x = drag.ox + ev.clientX - drag.sx;
    S.view.y = drag.oy + ev.clientY - drag.sy;
    applyView();
  } else if (drag.type === 'marquee'){
    const x = Math.min(drag.sx, ev.clientX), y = Math.min(drag.sy, ev.clientY);
    marqueeEl.style.left = x+'px'; marqueeEl.style.top = y+'px';
    marqueeEl.style.width = Math.abs(ev.clientX-drag.sx)+'px';
    marqueeEl.style.height = Math.abs(ev.clientY-drag.sy)+'px';
    drag.ex = ev.clientX; drag.ey = ev.clientY;
  } else if (drag.type === 'end' || drag.type === 'bend'){
    // 4px 死区:按下后的轻微抖动不算拖拽(与节点/便签一致),否则单击被误判拖拽、箭头终点卡进圆圈内
    if (!drag.moved){
      if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) <= 4) return;
      drag.moved = true;
    }
    const w = toWorld(ev.clientX, ev.clientY);
    if (drag.type === 'end'){
      // 端点吸附:命中节点时高亮并吸到其边缘,松手未命中则保持悬空灰色
      // 已连接边拖拽时使用更小吸附半径,便于脱离
      const snapRadius = drag.wasConnected ? (n) => n.r * 0.6 : (n) => n.r + 12;
      const snap = S.nodes.find(n => n.id !== drag.e.from && Math.hypot(n.x-w.x, n.y-w.y) < snapRadius(n)) || null;
      const a = nodeById(drag.e.from);
      let px = w.x, py = w.y;
      if (snap !== null){
        if (S.snapTo !== snap.id){ S.snapTo = snap.id; }
        const dx = snap.x-a.x, dy = snap.y-a.y, d = Math.hypot(dx,dy)||1;
        const len = Math.max(10, d - snap.r);
        px = a.x + dx/d*len; py = a.y + dy/d*len;
      } else {
        if (S.snapTo){ S.snapTo = null; }
      }
      drag.e.dx = px - a.x; drag.e.dy = py - a.y; // 拖拽完全跟随指针:方向自由自定义
      // 钉住前段锚点 B(0.25):曲线前半段基本固定,后半段自由弯折,保持平滑
      if (drag.anchor){
        const g = edgeEnds(drag.e), t = .25, it = .75;
        drag.e.cx = (drag.anchor.x - it*it*g.x1 - t*t*g.x2) / (2*it*t) - (g.x1+g.x2)/2;
        drag.e.cy = (drag.anchor.y - it*it*g.y1 - t*t*g.y2) / (2*it*t) - (g.y1+g.y2)/2;
      }
    } else {
      // 弯折:抓取点(参数 t 处)固定在指针下,反推控制点,其余部分随之变形
      const g = edgeEnds(drag.e), t = drag.t || .5, it = 1-t;
      drag.e.cx = (w.x - it*it*g.x1 - t*t*g.x2) / (2*it*t) - (g.x1+g.x2)/2;
      drag.e.cy = (w.y - it*it*g.y1 - t*t*g.y2) / (2*it*t) - (g.y1+g.y2)/2;
    }
    scheduleRender();
  } else if (drag.type === 'ann'){
    if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 4) drag.moved = true;
    if (drag.moved){
      drag.a.dx = drag.odx + (ev.clientX - drag.sx) / S.view.k;
      drag.a.dy = drag.ody + (ev.clientY - drag.sy) / S.view.k;
      scheduleRender();
    }
  } else {
    if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 4) drag.moved = true;
    if (drag.moved){
      drag.n.x = drag.ox + (ev.clientX - drag.sx) / S.view.k;
      drag.n.y = drag.oy + (ev.clientY - drag.sy) / S.view.k;
      scheduleRender();
    }
  }
});
addEventListener('pointerup', ev => {
  if (drag && drag.type === 'marquee'){
    marqueeEl.style.display = 'none';
    const x1 = Math.min(drag.sx, drag.ex ?? drag.sx), y1 = Math.min(drag.sy, drag.ey ?? drag.sy);
    const x2 = Math.max(drag.sx, drag.ex ?? drag.sx), y2 = Math.max(drag.sy, drag.ey ?? drag.sy);
    if (x2 - x1 > 6 || y2 - y1 > 6){
      const p1 = toWorld(x1, y1), p2 = toWorld(x2, y2);
      const inRect = (x, y) => x >= p1.x && x <= p2.x && y >= p1.y && y <= p2.y;
      for (const n of S.nodes) if (inRect(n.x, n.y)) S.multi.push({kind:'node', id:n.id});
      for (const e of S.edges){
        if (!S.showFailed && e.status === 'failed') continue; // 隐藏的失败线不参与框选
        const g = edgeCurve(e); let hit = inRect(g.x1, g.y1) && inRect(g.x2, g.y2);
        if (!hit) for (let t = 0; t <= 1.001 && !hit; t += .1) hit = inRect(bezPt(t, g).x, bezPt(t, g).y);
        if (hit) S.multi.push({kind:'edge', id:e.id});
      }
      render();
      if (S.multi.length){
        // 一键删除按钮:悬浮在选区右上角
        let mX = -1e9, mY = 1e9;
        for (const m of S.multi){
          if (m.kind==='node'){ const n=nodeById(m.id); if (n){ mX=Math.max(mX,n.x+n.r); mY=Math.min(mY,n.y-n.r); } }
          else { const e2=edgeById(m.id); if (e2){ const g=edgeCurve(e2); mX=Math.max(mX,g.x1,g.x2); mY=Math.min(mY,g.y1,g.y2); } }
        }
        delFloat.style.left = (mX*S.view.k + S.view.x + 12) + 'px';
        delFloat.style.top = (mY*S.view.k + S.view.y - 44) + 'px';
        delFloat.classList.add('on');
      }
    } else {
      // 框选距离太小视为点击:清空选择(延迟渲染)
      S.selAnn = null; clearMulti(); S.sel = null;
      // 路线名/方案名标签双击行内编辑:浏览器 dblclick 会因渲染重建 DOM 而丢失,这里手动识别(按对象 key,元素实例会随渲染重建)
      const dblTarget = ev.target.closest('.route-label') || ev.target.closest('#edges text');
      if (dblTarget){
        const isRoute = dblTarget.classList.contains('route-label');
        const key = isRoute ? 'r:' + dblTarget.dataset.route : 'e:' + (dblTarget.closest('[data-edge]')?.dataset.edge || '');
        const now = Date.now();
        if (lastClick && lastClick.key === key && now - lastClick.t < 400){
          lastClick = null;
          if (isRoute){
            const r = S.routes.find(x => x.id === dblTarget.dataset.route);
            if (r) editRouteName(r, dblTarget);
          } else {
            const g = dblTarget.closest('[data-edge]');
            if (g){ const e = edgeById(g.dataset.edge); if (e) editEdgeName(e, dblTarget); }
          }
        } else {
          lastClick = { key, t: now };
        }
      }
      requestAnimationFrame(() => { render(); renderPanel(); });
    }
  }
  if (drag && drag.type === 'node' && !drag.moved){
    S.sel = {kind:'node', id:drag.n.id}; S.selAnn = null;
    // 延迟渲染保持 DOM 稳定:同步重建会销毁事件目标,浏览器不再派发 click/dblclick(双击编辑依赖它)
    requestAnimationFrame(() => { render(); renderPanel(); });
  }
  if (drag && drag.type === 'node' && drag.moved) pushHistory();
  // 手柄拖拽结束:端点命中节点则吸附连接并标为成功(变绿);未命中保持悬空灰色
  if (drag && drag.type === 'end'){
    if (drag.moved){
      if (S.snapTo){
        const snap = nodeById(S.snapTo);
        if (snap && snap.id !== drag.e.from){
          delete drag.e.dx; delete drag.e.dy;
          drag.e.to = snap.id; drag.e.status = 'success';
        }
        S.snapTo = null;
      }
      pushHistory();
    } else if (S.drawingEdge === drag.e.id){
      // 点击节点未拖动:自动生成一条默认长度悬空线,方向与同节点已有线 ≥30° 自动错开
      const len = Math.hypot(150, 40);
      const ang = avoidAngleDeg(Math.atan2(40, 150) * 180 / Math.PI, drag.e) * Math.PI / 180;
      drag.e.dx = len * Math.cos(ang); drag.e.dy = len * Math.sin(ang);
    }
    if (S.drawingEdge === drag.e.id) S.drawingEdge = null; // 保持箭头工具,可连续拉线
    render(); renderPanel();
  }
  if (drag && drag.type === 'bend'){
    if (drag.moved) pushHistory();
    else {
      // 双击方案线任意位置(线身/中点手柄/标签)行内重命名:选中会重建 DOM、原生 dblclick 常丢失,这里手动识别
      const gEl = ev.target.closest('[data-edge]');
      const eid = gEl ? gEl.dataset.edge : null;
      const now = Date.now();
      if (eid && lastClick && lastClick.key === 'e:'+eid && now - lastClick.t < 400){
        lastClick = null;
        const e = edgeById(eid);
        // 输入框定位到方案名标签处(标签隐藏时退化为点击位置)
        const tx = document.querySelector(`#edges g[data-edge="${CSS.escape(eid)}"] text`);
        if (e && tx) editEdgeName(e, tx);
      } else if (eid) {
        lastClick = { key:'e:'+eid, t: now };
      }
      select('edge', drag.e.id);
    }
  }
  if (drag && drag.type === 'ann'){
    if (drag.moved) pushHistory();
    else if (drag.wasSel) editAnn(drag.a);          // 已选中再点:行内编辑
    else if (S.selAnn !== drag.a.id){ S.selAnn = drag.a.id; render(); } // 首次点击:紫色选中
  }
  if (drag && drag.type === 'pan' && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 4
      && ev.target === viewport){ S.selAnn = null; select(null); clearMulti(); render(); }
  drag = null; viewport.classList.remove('panning');
});

delFloat.onclick = () => {
  if (!S.multi.length) return;
  pushHistory();
  const nodeIds = new Set(S.multi.filter(m => m.kind==='node').map(m => m.id));
  const edgeIds = new Set(S.multi.filter(m => m.kind==='edge').map(m => m.id));
  S.edges = S.edges.filter(e => {
    if (edgeIds.has(e.id)) return false;
    if (nodeIds.has(e.from)) return false;
    if (nodeIds.has(e.to)){
      const origTo = e.to; e.to = null; e.status = 'pending';
      const a = nodeById(e.from), b = S.nodes.find(n => n.id === origTo) || {x:a.x+200,y:a.y};
      const d = Math.hypot(b.x-a.x, b.y-a.y)||1;
      e.dx = (b.x-a.x)/d*(d+50); e.dy = (b.y-a.y)/d*(d+50);
    }
    return true;
  });
  S.nodes = S.nodes.filter(n => !nodeIds.has(n.id));
  S.anns = S.anns.filter(a => (a.target.kind==='node' ? !nodeIds.has(a.target.id) : !edgeIds.has(a.target.id)));
  clearMulti(); select(null); render();
};

/* ---------- 文件 IO:map.json ↔ S（正式协同遵守 docs/map-json-v2.md） ---------- */
const IO = { dir:null, mapFile:null, mapId:null, lastMod:0, lastWrite:0, saveTimer:null, watching:false, silent:false, sourceDocument:null, sourceVersion:null, readOnly:false, restorePending:false };
let curationHintLevel = 0;
const hasFS = 'showDirectoryPicker' in window;
const today = () => new Date().toISOString().slice(0, 10);

/* S → map.json 对象;节点半径 r 不存(按文字重算) */
function serialize(){
  const cp = o => JSON.parse(JSON.stringify(o));
  const legacy = {
    version:1, name:S.name || $('#proj-name').textContent, updatedAt:today(),
    mapDir: currentMapDir || '.live-dot-map',
    view:{ x:S.view.x, y:S.view.y, k:S.view.k },
    ui:{ showAnns:S.showAnns, showRoutes:S.showRoutes, showNums:S.showNums, showFailed:S.showFailed },
    counters:{ num:S.nextNum, edge:S.nextEdge, ann:S.nextAnn, nodeName:S.nextNodeName, edgeName:S.nextEdgeName, routeName:S.nextRouteName },
    routes:cp(S.routes),
    nodes:S.nodes.map(n => { const c = cp(n); delete c.r; return c; }),
    edges:cp(S.edges), anns:cp(S.anns)
  };
  return IO.sourceDocument && window.LiveDotFallback
    ? window.LiveDotFallback.composeFallbackDocument(IO.sourceDocument, legacy)
    : legacy;
}
function serializeForSave(){
  const legacy = { ...serialize(), version:IO.sourceDocument?.version ?? 1 };
  if (!window.LiveDotFallback) return legacy;
  if (!IO.sourceDocument){
    const migrated = window.LiveDotFallback.prepareFallbackDocument(legacy);
    IO.sourceDocument = migrated.document; IO.sourceVersion = migrated.sourceVersion;
  }
  return window.LiveDotFallback.composeFallbackDocument(IO.sourceDocument, legacy, { commit:!IO.readOnly });
}
/* map.json 对象 → S;缺失字段补默认值,重置选择与撤销栈 */
/* counters 钳制:保存层可能长时间不同步 counters,盲信旧值会让 id/名称回退撞号;
   一律取「记录值」与「数据推导值」的较大者,保证单调递增(测试见 tests/web/counters-clamp.test.mjs) */
function clampCounters(c, nodes, edges, anns){
  const maxId = arr => Math.max(0, ...arr.map(o => parseInt(String(o.id).slice(1)) || 0));
  const maxNum = Math.max(0, ...nodes.map(n => parseInt(n.num) || 0));
  const maxNodeName = Math.max(0, ...nodes.map(n => {
    const m = /^新节点(\d+)$/.exec(n.name || ''); return m ? parseInt(m[1]) : 0;
  }));
  return {
    nextNum: Math.max(c.num ?? 0, maxNum + 1, maxId(nodes) + 1),
    nextEdge: Math.max(c.edge ?? 0, maxId(edges) + 1),
    nextAnn: Math.max(c.ann ?? 0, maxId(anns) + 1),
    nextNodeName: Math.max(c.nodeName ?? 1, maxNodeName + 1, nodes.length + 1),
    nextEdgeName: Math.max(c.edgeName ?? 1, 1),
    nextRouteName: Math.max(c.routeName ?? 1, 1),
  };
}
function deserialize(d){
  const td = today();
  currentMapDir = typeof d.mapDir === 'string' && d.mapDir ? d.mapDir : '.live-dot-map';
  S.name = d.name || '未命名地图';
  S.view = d.view || { x:0, y:0, k:1 };
  const ui = d.ui || {};
  S.showAnns = ui.showAnns !== false; S.showRoutes = ui.showRoutes !== false;
  S.showNums = !!ui.showNums; S.showFailed = ui.showFailed !== false;
  const c = d.counters || {};
  S.routes = d.routes || [];
  S.nodes = (d.nodes || []).map(n => ({ r:34, createdAt:td, updatedAt:td, ...n,
    kind: n.kind || (n.type === '问题' ? 'problem' : n.type === '结果' ? 'result' : 'goal')
  }));
  S.edges = (d.edges || []).map(e => ({ createdAt:td, updatedAt:td, ...e }));
  S.anns  = (d.anns  || []).map(a => ({ hidden:false, createdAt:td, updatedAt:td, ...a }));
  const cc = clampCounters(c, S.nodes, S.edges, S.anns);
  S.nextNum = cc.nextNum; S.nextEdge = cc.nextEdge; S.nextAnn = cc.nextAnn;
  S.nextNodeName = cc.nextNodeName; S.nextEdgeName = cc.nextEdgeName; S.nextRouteName = cc.nextRouteName;
  S.sel = null; S.selAnn = null; S.multi = [];
  S.hoverEdge = null; S.snapTo = null; S.drawingEdge = null; S.pendingEdgeFrom = null;
  undoStack = []; redoStack = []; // 加载新地图后清空撤销栈
}

function queueReadOnlyRestore(){
  if (!IO.readOnly || IO.restorePending) return;
  IO.restorePending = true;
  queueMicrotask(() => {
    IO.restorePending = false;
    if (!IO.readOnly || !IO.sourceDocument) return;

function acceptMapDocument(document, source='import'){

}

/* ---- IndexedDB:记住上次项目文件夹句柄 ---- */
function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open('live-dot-map', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v){ const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbGet(k){ const db = await idbOpen(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
/* ---- 文件夹连接与读写 ---- */
async function openProjectFolder(){

  try{

      toast('项目文件夹已变化，请重新选择项目。');

  }

const MAP_ID_RE = /^[a-z0-9][a-z0-9-_]{0,63}$/;
function slugifyMapId(name){
  const base = String(name || '').normalize('NFKC').toLowerCase().replace(/[^a-z0-9-_]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48);
  return base || 'map-' + Date.now().toString(36);
}
async function fsDirHandle(parent, name, create){
  try{ return await parent.getDirectoryHandle(name, { create:!!create }); }
  catch(e){ if (create) throw e; return null; }
}
async function fsFileHandle(dir, name, create){

  catch(e){ if (create) throw e; return null; }
}
async function fsReadJson(fh){

async function fsWriteJson(fh, value){

/* active-map 指针：缺/非法时回退 default（与桥端 resolveActiveMap 一致） */
async function fsReadActiveMap(dir){

  const active = await fsReadActiveMap(dir);

  for await (const [id, handle] of mapsDir.entries()){
    if (handle.kind !== 'directory' || !MAP_ID_RE.test(id)) continue;
    const doc = await fsReadJson(await fsFileHandle(handle, 'map.json'));

async function fsCopyDir(src, dst){
  for await (const [name, handle] of src.entries()){
    if (handle.kind === 'directory'){
      await fsCopyDir(handle, await dst.getDirectoryHandle(name, { create:true }));
    } else {
      const w = await (await dst.getFileHandle(name, { create:true })).createWritable();
      await w.write(await (await handle.getFile()).arrayBuffer());
      await w.close();
    }
  }
}
/* 老布局(.live-dot-map/map.json + nodes/ + routes/)复制式迁移到 maps/default/；
   旧文件原地保留作为现场备份，与桥端 migrateLegacyLayout 的语义对应。 */
async function fsEnsureMapsLayout(dir){
  const data = await fsDirHandle(dir, '.live-dot-map', true);
  if (await fsDirHandle(data, 'maps')) return;
  const legacy = await fsReadJson(await fsFileHandle(data, 'map.json'));
  if (!legacy) return; // 全新项目：由调用方按需创建 maps/<id>/
  const mapDir = '.live-dot-map/maps/default';
  const rewriteMd = (m) => typeof m === 'string' && m.startsWith('.live-dot-map/') ? mapDir + m.slice('.live-dot-map'.length) : m;
  const doc = { ...legacy, mapDir };
  if (Array.isArray(legacy.nodes)) doc.nodes = legacy.nodes.map(n => ({ ...n, md: rewriteMd(n.md) }));
  if (Array.isArray(legacy.edges)) doc.edges = legacy.edges.map(e => ({ ...e, md: rewriteMd(e.md) }));
  const def = await (await data.getDirectoryHandle('maps', { create:true })).getDirectoryHandle('default', { create:true });
  await fsWriteJson(await def.getFileHandle('map.json', { create:true }), doc);
  for (const sub of ['nodes', 'routes']){
    const src = await fsDirHandle(data, sub);
    if (src) await fsCopyDir(src, await def.getDirectoryHandle(sub, { create:true }));
  }
  await fsWriteActiveMap(dir, 'default');
  toast('已把旧版单地图升级为多地图布局（原文件已保留）');
}
/* 新建一张地图：maps/<id>/map.json + 指针切换；id 撞名时追加 -2/-3 */
async function fsCreateMap(dir, name){
  await fsEnsureMapsLayout(dir);
  const mapsDir = await (await dir.getDirectoryHandle('.live-dot-map')).getDirectoryHandle('maps', { create:true });
  const base = slugifyMapId(name);
  let id = base, n = 2;
  while (await fsDirHandle(mapsDir, id)) id = `${base}-${n++}`;
  const md = await mapsDir.getDirectoryHandle(id, { create:true });
  const fh = await md.getFileHandle('map.json', { create:true });
  await fsWriteActiveMap(dir, id);
  return { id, mapDir: `.live-dot-map/maps/${id}`, fh };
}

/* Chromium 的 createWritable 先写交换文件、close 才替换原文件,天然原子 */
async function writeMapNow(){

  const w = await IO.mapFile.createWritable();
  await w.write(JSON.stringify(document, null, 2));
  await w.close();
  IO.sourceDocument = JSON.parse(JSON.stringify(document)); IO.sourceVersion = document.version;

function setupDrop(){

  vp.addEventListener('dragenter', e => { e.preventDefault(); depth++; vp.classList.add('drop-hint'); });
  vp.addEventListener('dragover', e => { e.preventDefault(); });
  vp.addEventListener('dragleave', e => { e.preventDefault(); if (--depth <= 0){ depth = 0; vp.classList.remove('drop-hint'); } });
  vp.addEventListener('drop', async e => {
    e.preventDefault(); depth = 0; vp.classList.remove('drop-hint');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (!/\.json$/i.test(f.name)){ toast('请拖入 .json 格式的地图文件。'); return; }
    try{

function loadDemoMap(){
  IO.sourceDocument = null; IO.sourceVersion = null; IO.readOnly = false; IO.mapFile = null; IO.mapId = null;
  currentMapDir = '.live-dot-map';

  applyName(); render(); fitView(); toast('已加载简单示例（不会读取项目文件）');
}
function showTutorial(){
  const ov = overlayCard(`
    <div style="font-size:16px;font-weight:700">三分钟上手</div>
    <ol style="margin:14px 0 0;padding-left:20px;font-size:13px;line-height:1.9;color:var(--fg)">
      <li><b>画布</b>：滚轮缩放，空格或中键拖拽平移。快捷键 V 选择、N 建节点、L 拉方案线、M 加便签。</li>
      <li><b>节点与方案</b>：节点只写目标/问题/结果；每一次尝试是一条方案线——绿=成功，红=失败，灰=待验证。成功了顺手打个分（0–100），以后一眼看出哪条最值。</li>
      <li><b>文件夹即存档</b>：选择项目后，改动自动存进项目，详情写在 Markdown 里。不用的方案可以归档——只是淡出，不删数据。</li>

/* ---------- 启动 ---------- */
// PWA:注册 service worker(file:// 双击打开时自动跳过)
// 本地桥 loopback 页面不注册：SW 会拦截 /api/v1/*（Firefox 的 EventSource 尤其受影响），
// 且本地协作页面的应用壳应始终来自当前桥版本，不需要离线缓存。
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !/^(127\.0\.0\.1|localhost|\[::1\])/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
const q = new URLSearchParams(location.search);
if (q.get('blank') === '1' || q.get('empty') === '1'){
  // 空画布:工具可用,无中央输入
  S.nodes = []; S.edges = []; S.anns = []; S.routes = [{id:'r1', name:'主路线', source:null, main:true, createdAt:today(), updatedAt:today()}];
}
if (q.get('demo') === '1'){
  S = seed();
}
if (q.get('stress')){
  // 性能压测:?stress=N 生成 N 节点 + 2N 方案线(只在内存,不写文件)
  const N = Math.max(10, +q.get('stress') || 200);
  S.nodes = []; S.edges = []; S.anns = [];
  S.routes = [{id:'r1', name:'压测路线', source:null, main:true, createdAt:today(), updatedAt:today()}];
  for (let i = 0; i < N; i++){
    const col = i % 20, row = (i / 20) | 0;
    S.nodes.push({ id:'n'+(i+1), num:String(i+1).padStart(2,'0'), name:'节点'+(i+1),
      type: i%7===0 ? '问题' : (i%3===0 ? '结果' : '目标'), route:'r1',
      x:col*260, y:row*220, r:34, md:null, createdAt:today(), updatedAt:today() });
  }
  for (let i = 0; i < N*2; i++){
    const f = (i % N) + 1, t = ((i*7+3) % N) + 1;
    const e = { id:'e'+(i+1), from:'n'+f, to: i%4===0 ? null : 'n'+t,
      name:'方案'+(i+1), status:['success','failed','pending'][i%3], route:'r1',
      md:null, createdAt:today(), updatedAt:today() };
    if (!e.to){ e.dx = 120 + (i%5)*30; e.dy = 90 - (i%3)*60; }
    S.edges.push(e);
  }
  S.nextNum = N+1; S.nextEdge = N*2+1;
}
render();
fitView();
if (q.get('from') === 'agent'){
  agentWork('正在建立地图…', () => { render(); }, 1400);
}
boot().then(() => { // 首次使用且未自动连上项目文件夹时,显示新手引导
  // 没有地图时只显示三个明确入口；选择过任意入口后不再打扰（dotmap-guide-seen 去重）。
  let guideSeen = false;
  try { guideSeen = localStorage.getItem('dotmap-guide-seen') === '1'; } catch { /* 隐私模式 */ }
  if (!guideSeen && !window.LiveDotBridge?.active && !IO.mapFile && !q.get('blank') && !q.get('empty') && !q.get('demo') && !q.get('stress') && q.get('from') !== 'agent' && S.nodes.length === 0){
    void showFirstMapGuide();
  }
});

    if (!Array.isArray(ids) || !ids.length) return;
    setTimeout(() => {
      const wanted = new Set(ids.map(String));
      let count = 0;
      document.querySelectorAll('.node,[data-edge],.ann').forEach(el => {
        const id = el.dataset.id || el.dataset.edge || el.dataset.ann;
        if (id && wanted.has(id)){
          el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); count++;

      if (count) setTimeout(() => {

      }, 3600);
    }, 80);
  }
};

name: 部署到 Cloudflare

# .deploy/ 是构建产物并已入库；push 改动它时才需要重部署。
# EdgeOne（livedotmap.top）由平台侧连仓库自动构建，不在本流水线内。
on:
  push:
    branches: [master]
    paths:
      - '.deploy/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  cloudflare:
    name: Cloudflare Workers（app.live-dot-map.workers.dev）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wrangler deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

# 活点地图静态托管（Cloudflare Workers Static Assets）
# 部署目录 .deploy/ 由 implement.md「阶段 5」流程生成，内容即站点本体。
name = "app"
compatibility_date = "2026-08-08"

[assets]
directory = "./.deploy"
# Windows 桥接器由安装器/Release 分发，不作为网页静态资产上传。
# Cloudflare Workers Static Assets 单文件上限为 25 MiB。
exclude = [
  "livedot-bridge-win-x64.exe",
  "livedot-bridge-win-x64.blob",
  "sea-prep.exe",
  "sea-manifest.json",
]
